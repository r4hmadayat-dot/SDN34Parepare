<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0877e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Presensi Guru - UPTD SDN 34 Parepare</title>
<style>
:root{--p:#0877e8;--bg:#eef4fb;--text:#162235;--muted:#6f7e91}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text)}.app{width:100%;height:100dvh;position:relative}.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:24px;background:linear-gradient(160deg,#fbfdff,#eef4fb);z-index:5}.logo-box{width:120px;height:120px;padding:9px;border-radius:30px;background:#fff;display:grid;place-items:center;box-shadow:0 18px 46px rgba(20,70,120,.14);border:1px solid rgba(20,70,120,.08)}.logo-box img{width:100%;height:100%;object-fit:contain;border-radius:22px}.school{font-size:14px;font-weight:900;color:#0d5fae;text-align:center}.loader-title{font-size:26px;font-weight:950}.loader-status{font-size:13px;color:var(--muted)}.loader-error{display:none;max-width:560px;padding:12px 14px;border-radius:14px;background:#fff5f5;border:1px solid #edc7ca;color:#9e2027;text-align:center}.retry,.install{border:0;border-radius:14px;padding:12px 18px;font-weight:900}.retry{display:none;background:#eaf3ff;color:#0a5fae}.install{position:fixed;right:15px;bottom:15px;z-index:20;background:var(--p);color:#fff;box-shadow:0 12px 28px rgba(8,119,232,.24);display:none}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}@media(max-width:600px){.logo-box{width:100px;height:100px}.loader-title{font-size:22px}.school{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <section id="loader" class="loader">
    <div class="logo-box"><img src="./icon-512.png" alt="Logo UPTD SDN 34 Parepare"></div>
    <div class="school">UPTD SDN 34 PAREPARE</div>
    <div class="loader-title">Presensi Guru</div>
    <div id="loaderStatus" class="loader-status">Memuat aplikasi...</div>
    <div id="loaderError" class="loader-error"></div>
    <button id="retryBtn" class="retry" type="button">Coba Lagi</button>
  </section>
  <iframe id="appFrame" title="Presensi Guru - UPTD SDN 34 Parepare" allow="camera *; geolocation *; fullscreen *" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <button id="installBtn" class="install" type="button">📲 Pasang Aplikasi</button>
</div>
<script src="./config.js"></script>
<script>
(function(){
 const frame=document.getElementById('appFrame'),loader=document.getElementById('loader'),status=document.getElementById('loaderStatus'),err=document.getElementById('loaderError'),retry=document.getElementById('retryBtn'),install=document.getElementById('installBtn');
 let deferredPrompt=null;
 function showError(title,msg){status.textContent=title;err.textContent=msg;err.style.display='block';retry.style.display='inline-block'}
 function loadApp(){
   err.style.display='none';retry.style.display='none';loader.style.display='flex';frame.style.display='none';
   const url=String(window.APP_CONFIG&&window.APP_CONFIG.appUrl||'').trim();
   if(!/^https:\/\//i.test(url)||!/\/exec(?:[?#].*)?$/i.test(url)){showError('URL Web App belum valid','Periksa config.js dan pastikan appUrl berakhiran /exec.');return}
   frame.src=url;frame.style.display='block';
   clearTimeout(window.__pwaLoadTimer);window.__pwaLoadTimer=setTimeout(()=>{if(loader.style.display!=='none')showError('Aplikasi belum merespons','Periksa deployment Apps Script dan koneksi internet.')},20000);
 }
 frame.addEventListener('load',()=>{clearTimeout(window.__pwaLoadTimer);loader.style.display='none'});
 retry.addEventListener('click',loadApp);
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='block'});
 install.addEventListener('click',async()=>{if(!deferredPrompt)return;const p=deferredPrompt;deferredPrompt=null;install.style.display='none';try{p.prompt();await p.userChoice}catch(e){}});
 window.addEventListener('appinstalled',()=>install.style.display='none');
 if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
 loadApp();
})();
</script>
</body>
</html>
